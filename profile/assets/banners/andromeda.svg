<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" role="img" aria-label="Andromeda Constellation">
  <defs>
    <radialGradient id="nebula" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#b32323" stop-opacity="0.28"/>
      <stop offset="55%" stop-color="#b32323" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#b32323" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="coreglow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d32f2f" stop-opacity="0.85"/>
      <stop offset="45%" stop-color="#b32323" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#b32323" stop-opacity="0"/>
    </radialGradient>
    <style>
      .bg { fill: #272727; }
      .nebula { fill: url(#nebula); }
      .dust { fill: #b32323; }
      .c-line { stroke: #b32323; stroke-width: 1.6; stroke-linecap: round; stroke-opacity: 0.85; fill: none; }
      .c-line-subtle { stroke: #b32323; stroke-width: 1.1; stroke-linecap: round; stroke-opacity: 0.48; fill: none; }
      .node-glow { fill: url(#coreglow); }
      .node-core { fill: #d32f2f; }
      .node-center { fill: #ffffff; }
      @keyframes star-fade {
        0%, 100% { opacity: 0.03; }
        35%, 65% { opacity: 0.94; }
      }
      @keyframes star-breathe {
        0%, 100% { opacity: 0.25; transform: scale(0.88); }
        50% { opacity: 1; transform: scale(1.12); }
      }
      .fade-dot { animation: star-fade 4.5s ease-in-out infinite; }
      .star-node { animation: star-breathe 4.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      @media (prefers-reduced-motion: reduce) {
        .fade-dot, .star-node { animation: none !important; opacity: 0.8; }
      }
    </style>
  </defs>
  <rect width="1200" height="260" rx="14" class="bg"/>
  <circle cx="600" cy="130" r="190" class="nebula"/>
  <ellipse cx="635" cy="76" rx="56" ry="20" transform="rotate(-24 635 76)" class="nebula"/>
  <g class="dust-field">
    <circle cx="88" cy="54" r="1.2" class="dust fade-dot" style="animation-duration:4.3s; animation-delay:-0.8s;"/>
    <circle cx="172" cy="198" r="1.4" class="dust fade-dot" style="animation-duration:5.1s; animation-delay:-2.4s;"/>
    <circle cx="255" cy="72" r="1.0" class="dust fade-dot" style="animation-duration:3.8s; animation-delay:-1.2s;"/>
    <circle cx="330" cy="210" r="1.3" class="dust fade-dot" style="animation-duration:4.9s; animation-delay:-3.1s;"/>
    <circle cx="845" cy="58" r="1.1" class="dust fade-dot" style="animation-duration:5.5s; animation-delay:-0.4s;"/>
    <circle cx="920" cy="188" r="1.5" class="dust fade-dot" style="animation-duration:4.0s; animation-delay:-2.6s;"/>
    <circle cx="995" cy="84" r="1.2" class="dust fade-dot" style="animation-duration:5.2s; animation-delay:-1.7s;"/>
    <circle cx="1075" cy="202" r="1.3" class="dust fade-dot" style="animation-duration:3.9s; animation-delay:-0.5s;"/>
    <circle cx="1140" cy="112" r="1.1" class="dust fade-dot" style="animation-duration:4.7s; animation-delay:-2.9s;"/>
    <circle cx="140" cy="135" r="1.1" class="dust fade-dot" style="animation-duration:4.6s; animation-delay:-1.9s;"/>
    <circle cx="395" cy="64" r="1.0" class="dust fade-dot" style="animation-duration:5.0s; animation-delay:-3.3s;"/>
    <circle cx="805" cy="212" r="1.2" class="dust fade-dot" style="animation-duration:4.1s; animation-delay:-1.4s;"/>
    <circle cx="210" cy="126" r="1.0" class="dust fade-dot" style="animation-duration:4.8s; animation-delay:-2.1s;"/>
    <circle cx="965" cy="142" r="1.1" class="dust fade-dot" style="animation-duration:4.4s; animation-delay:-0.9s;"/>
  </g>
  <g class="constellation-lines">
    <path d="M430 164 L525 138 L628 118 L742 96" class="c-line"/>
    <path d="M525 138 L508 196 L430 164" class="c-line-subtle"/>
    <path d="M628 118 L635 76 L675 50" class="c-line"/>
    <path d="M742 96 L798 142 L772 192" class="c-line-subtle"/>
    <path d="M628 118 L662 178" class="c-line-subtle"/>
  </g>
  <g class="constellation-nodes">
    <g class="star-node" style="animation-duration:3.9s; animation-delay:-0.3s;">
      <circle cx="430" cy="164" r="13" class="node-glow"/><circle cx="430" cy="164" r="4.5" class="node-core"/><circle cx="430" cy="164" r="2" class="node-center"/>
    </g>
    <g class="star-node" style="animation-duration:4.5s; animation-delay:-1.6s;">
      <circle cx="525" cy="138" r="11" class="node-glow"/><circle cx="525" cy="138" r="3.8" class="node-core"/><circle cx="525" cy="138" r="1.7" class="node-center"/>
    </g>
    <g class="star-node" style="animation-duration:4.1s; animation-delay:-2.4s;">
      <circle cx="628" cy="118" r="13" class="node-glow"/><circle cx="628" cy="118" r="4.4" class="node-core"/><circle cx="628" cy="118" r="2" class="node-center"/>
    </g>
    <g class="star-node" style="animation-duration:4.8s; animation-delay:-0.9s;">
      <circle cx="742" cy="96" r="12" class="node-glow"/><circle cx="742" cy="96" r="4.2" class="node-core"/><circle cx="742" cy="96" r="1.8" class="node-center"/>
    </g>
    <g class="star-node" style="animation-duration:3.7s; animation-delay:-2.1s;">
      <circle cx="635" cy="76" r="11" class="node-glow"/><circle cx="635" cy="76" r="3.5" class="node-core"/><circle cx="635" cy="76" r="1.6" class="node-center"/>
    </g>
    <g class="star-node" style="animation-duration:5.1s; animation-delay:-1.3s;">
      <circle cx="675" cy="50" r="8" class="node-glow"/><circle cx="675" cy="50" r="2.8" class="node-core"/><circle cx="675" cy="50" r="1.2" class="node-center"/>
    </g>
    <g class="star-node" style="animation-duration:4.4s; animation-delay:-2.9s;">
      <circle cx="508" cy="196" r="8" class="node-glow"/><circle cx="508" cy="196" r="2.8" class="node-core"/><circle cx="508" cy="196" r="1.2" class="node-center"/>
    </g>
    <g class="star-node" style="animation-duration:4.7s; animation-delay:-0.6s;">
      <circle cx="798" cy="142" r="8" class="node-glow"/><circle cx="798" cy="142" r="2.8" class="node-core"/><circle cx="798" cy="142" r="1.2" class="node-center"/>
    </g>
  </g>
</svg>
