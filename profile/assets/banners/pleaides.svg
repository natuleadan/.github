<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" role="img" aria-label="Pleaides Seven Sisters v2">
  <defs>
    <radialGradient id="nebula" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#b32323" stop-opacity="0.34"/>
      <stop offset="55%" stop-color="#b32323" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#b32323" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="coreglow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.92"/>
      <stop offset="35%" stop-color="#d32f2f" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#b32323" stop-opacity="0"/>
    </radialGradient>
    <style>
      .bg { fill: #272727; }
      .nebula { fill: url(#nebula); }
      .dust { fill: #b32323; }
      .c-line { stroke: #b32323; stroke-width: 1.6; stroke-linecap: round; stroke-opacity: 0.85; fill: none; }
      .kinematic-arc { stroke: #d32f2f; stroke-width: 1.1; stroke-dasharray: 4, 5; stroke-opacity: 0.50; fill: none; }
      .node-glow { fill: url(#coreglow); }
      .node-core { fill: #d32f2f; }
      .node-center { fill: #ffffff; }
      @keyframes star-fade { 0%, 100% { opacity: 0.03; } 35%, 65% { opacity: 0.94; } }
      @keyframes star-breathe { 0%, 100% { opacity: 0.28; transform: scale(0.86); } 50% { opacity: 1; transform: scale(1.16); } }
      .fade-dot { animation: star-fade 4.4s ease-in-out infinite; }
      .star-node { animation: star-breathe 3.9s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      @media (prefers-reduced-motion: reduce) { .fade-dot, .star-node { animation: none !important; opacity: 0.85; } }
    </style>
  </defs>
  <rect width="1200" height="260" rx="14" class="bg"/>
  <circle cx="600" cy="130" r="195" class="nebula"/>
  <circle cx="635" cy="116" r="85" class="nebula"/>
  <g class="dust-field">
    <circle cx="92" cy="60" r="1.2" class="dust fade-dot" style="animation-duration:4.0s; animation-delay:-0.6s;"/>
    <circle cx="178" cy="196" r="1.4" class="dust fade-dot" style="animation-duration:5.2s; animation-delay:-2.2s;"/>
    <circle cx="265" cy="78" r="1.0" class="dust fade-dot" style="animation-duration:3.7s; animation-delay:-1.5s;"/>
    <circle cx="870" cy="198" r="1.5" class="dust fade-dot" style="animation-duration:3.9s; animation-delay:-0.4s;"/>
    <circle cx="950" cy="84" r="1.1" class="dust fade-dot" style="animation-duration:5.0s; animation-delay:-2.7s;"/>
    <circle cx="1035" cy="176" r="1.3" class="dust fade-dot" style="animation-duration:4.4s; animation-delay:-1.2s;"/>
    <circle cx="145" cy="128" r="1.1" class="dust fade-dot" style="animation-duration:4.7s; animation-delay:-2.3s;"/>
    <circle cx="295" cy="144" r="1.0" class="dust fade-dot" style="animation-duration:3.9s; animation-delay:-1.7s;"/>
    <circle cx="385" cy="182" r="1.2" class="dust fade-dot" style="animation-duration:5.1s; animation-delay:-0.5s;"/>
    <circle cx="780" cy="64" r="1.1" class="dust fade-dot" style="animation-duration:4.5s; animation-delay:-2.8s;"/>
    <circle cx="825" cy="168" r="1.2" class="dust fade-dot" style="animation-duration:4.8s; animation-delay:-1.1s;"/>
    <circle cx="915" cy="136" r="1.0" class="dust fade-dot" style="animation-duration:4.2s; animation-delay:-3.0s;"/>
    <circle cx="1095" cy="118" r="1.3" class="dust fade-dot" style="animation-duration:5.2s; animation-delay:-0.6s;"/>
    <circle cx="1140" cy="195" r="1.1" class="dust fade-dot" style="animation-duration:4.6s; animation-delay:-1.9s;"/>
  </g>
  <circle cx="605" cy="128" r="82" class="kinematic-arc"/>
  <path d="M515 174 Q580 56 692 98" class="kinematic-arc"/>
  <path d="M485 168 L544 136 L592 106 L648 90 L702 112 L646 146 L592 106 M544 136 L584 172 L646 146 M592 106 L552 78" class="c-line"/>
  <g class="constellation-nodes">
    <g class="star-node" style="animation-delay:-0.3s;"><circle cx="592" cy="106" r="16" class="node-glow"/><circle cx="592" cy="106" r="5.0" class="node-core"/><circle cx="592" cy="106" r="2.2" class="node-center"/></g>
    <g class="star-node" style="animation-delay:-1.5s;"><circle cx="648" cy="90" r="13" class="node-glow"/><circle cx="648" cy="90" r="4.2" class="node-core"/><circle cx="648" cy="90" r="1.8" class="node-center"/></g>
    <g class="star-node" style="animation-delay:-2.3s;"><circle cx="702" cy="112" r="12" class="node-glow"/><circle cx="702" cy="112" r="3.9" class="node-core"/><circle cx="702" cy="112" r="1.7" class="node-center"/></g>
    <g class="star-node" style="animation-delay:-0.9s;"><circle cx="646" cy="146" r="13" class="node-glow"/><circle cx="646" cy="146" r="4.2" class="node-core"/><circle cx="646" cy="146" r="1.9" class="node-center"/></g>
    <g class="star-node" style="animation-delay:-2.8s;"><circle cx="544" cy="136" r="12" class="node-glow"/><circle cx="544" cy="136" r="3.9" class="node-core"/><circle cx="544" cy="136" r="1.7" class="node-center"/></g>
    <g class="star-node" style="animation-delay:-1.2s;"><circle cx="584" cy="172" r="11" class="node-glow"/><circle cx="584" cy="172" r="3.5" class="node-core"/><circle cx="584" cy="172" r="1.5" class="node-center"/></g>
    <g class="star-node" style="animation-delay:-2.0s;"><circle cx="485" cy="168" r="10" class="node-glow"/><circle cx="485" cy="168" r="3.2" class="node-core"/><circle cx="485" cy="168" r="1.4" class="node-center"/></g>
  </g>
</svg>
