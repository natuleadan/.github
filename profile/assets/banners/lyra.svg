<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" role="img" aria-label="Lyra Harmonic Harp v2">
  <defs>
    <radialGradient id="nebula" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#b32323" stop-opacity="0.32"/>
      <stop offset="55%" stop-color="#b32323" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#b32323" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="coreglow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.96"/>
      <stop offset="35%" stop-color="#d32f2f" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#b32323" stop-opacity="0"/>
    </radialGradient>
    <style>
      .bg { fill: #272727; }
      .nebula { fill: url(#nebula); }
      .dust { fill: #b32323; }
      .c-line { stroke: #b32323; stroke-width: 1.6; stroke-linecap: round; stroke-opacity: 0.88; fill: none; }
      .wave-arc { stroke: #d32f2f; stroke-width: 1.1; stroke-opacity: 0.55; fill: none; stroke-linecap: round; }
      .harp-string { stroke: #ffffff; stroke-width: 0.8; stroke-opacity: 0.35; fill: none; }
      .node-glow { fill: url(#coreglow); }
      .node-core { fill: #d32f2f; }
      .node-center { fill: #ffffff; }
      @keyframes star-fade { 0%, 100% { opacity: 0.03; } 35%, 65% { opacity: 0.94; } }
      @keyframes star-breathe { 0%, 100% { opacity: 0.28; transform: scale(0.88); } 50% { opacity: 1; transform: scale(1.16); } }
      @keyframes acoustic-pulse { 0%, 100% { opacity: 0.25; } 50% { opacity: 0.85; } }
      .fade-dot { animation: star-fade 4.4s ease-in-out infinite; }
      .star-node { animation: star-breathe 3.9s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .wave-pulse { animation: acoustic-pulse 3.6s ease-in-out infinite; }
      @media (prefers-reduced-motion: reduce) { .fade-dot, .star-node, .wave-pulse { animation: none !important; opacity: 0.85; } }
    </style>
  </defs>
  <rect width="1200" height="260" rx="14" class="bg"/>
  <circle cx="600" cy="130" r="195" class="nebula"/>
  <g class="dust-field">
    <circle cx="92" cy="54" r="1.2" class="dust fade-dot" style="animation-duration:4.1s; animation-delay:-0.5s;"/>
    <circle cx="176" cy="196" r="1.4" class="dust fade-dot" style="animation-duration:5.2s; animation-delay:-2.1s;"/>
    <circle cx="268" cy="76" r="1.0" class="dust fade-dot" style="animation-duration:3.8s; animation-delay:-1.3s;"/>
    <circle cx="932" cy="82" r="1.2" class="dust fade-dot" style="animation-duration:4.9s; animation-delay:-2.5s;"/>
    <circle cx="1024" cy="192" r="1.4" class="dust fade-dot" style="animation-duration:4.2s; animation-delay:-1.1s;"/>
    <circle cx="1108" cy="64" r="1.1" class="dust fade-dot" style="animation-duration:5.4s; animation-delay:-3.2s;"/>
    <circle cx="144" cy="126" r="1.1" class="dust fade-dot" style="animation-duration:4.7s; animation-delay:-2.3s;"/>
    <circle cx="242" cy="164" r="1.0" class="dust fade-dot" style="animation-duration:3.9s; animation-delay:-1.7s;"/>
    <circle cx="378" cy="48" r="1.2" class="dust fade-dot" style="animation-duration:5.0s; animation-delay:-0.7s;"/>
    <circle cx="422" cy="204" r="1.1" class="dust fade-dot" style="animation-duration:4.5s; animation-delay:-2.9s;"/>
    <circle cx="792" cy="52" r="1.2" class="dust fade-dot" style="animation-duration:4.8s; animation-delay:-1.4s;"/>
    <circle cx="852" cy="192" r="1.0" class="dust fade-dot" style="animation-duration:4.3s; animation-delay:-3.0s;"/>
    <circle cx="972" cy="154" r="1.2" class="dust fade-dot" style="animation-duration:5.1s; animation-delay:-0.6s;"/>
    <circle cx="1146" cy="182" r="1.1" class="dust fade-dot" style="animation-duration:4.4s; animation-delay:-2.0s;"/>
  </g>
  <g class="acoustic-waves wave-pulse">
    <path d="M290 130 Q350 92 410 130 T510 130" class="wave-arc"/>
    <path d="M690 130 Q750 168 810 130 T910 130" class="wave-arc"/>
  </g>
  <g class="harp-strings wave-pulse" style="animation-delay:-1.8s;">
    <line x1="575" y1="112" x2="588" y2="194" class="harp-string"/>
    <line x1="600" y1="114" x2="612" y2="195" class="harp-string"/>
    <line x1="625" y1="116" x2="636" y2="196" class="harp-string"/>
  </g>
  <path d="M518 68 L560 110 L650 118 L662 198 L572 190 L560 110" class="c-line"/>
  <g class="constellation-nodes">
    <g class="star-node" style="animation-delay:-0.3s;"><circle cx="518" cy="68" r="20" class="node-glow"/><circle cx="518" cy="68" r="6.2" class="node-core"/><circle cx="518" cy="68" r="2.8" class="node-center"/></g>
    <g class="star-node" style="animation-delay:-1.4s;"><circle cx="560" cy="110" r="11" class="node-glow"/><circle cx="560" cy="110" r="3.6" class="node-core"/><circle cx="560" cy="110" r="1.6" class="node-center"/></g>
    <g class="star-node" style="animation-delay:-2.2s;"><circle cx="650" cy="118" r="11" class="node-glow"/><circle cx="650" cy="118" r="3.6" class="node-core"/><circle cx="650" cy="118" r="1.6" class="node-center"/></g>
    <g class="star-node" style="animation-delay:-0.9s;"><circle cx="662" cy="198" r="12" class="node-glow"/><circle cx="662" cy="198" r="3.9" class="node-core"/><circle cx="662" cy="198" r="1.7" class="node-center"/></g>
    <g class="star-node" style="animation-delay:-2.7s;"><circle cx="572" cy="190" r="12" class="node-glow"/><circle cx="572" cy="190" r="3.9" class="node-core"/><circle cx="572" cy="190" r="1.7" class="node-center"/></g>
  </g>
</svg>
