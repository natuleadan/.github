<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" role="img" aria-label="Aurora Celestial Ribbon">
  <defs>
    <radialGradient id="nebula" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#b32323" stop-opacity="0.28"/>
      <stop offset="55%" stop-color="#b32323" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#b32323" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ribbon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b32323" stop-opacity="0"/>
      <stop offset="25%" stop-color="#d32f2f" stop-opacity="0.42"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="75%" stop-color="#d32f2f" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#b32323" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="coreglow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d32f2f" stop-opacity="0.85"/>
      <stop offset="45%" stop-color="#b32323" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#b32323" stop-opacity="0"/>
    </radialGradient>
    <style>
      .bg { fill: #272727; }
      .nebula { fill: url(#nebula); }
      .dust { fill: #b32323; }
      .ribbon-1 { stroke: url(#ribbon); stroke-width: 14; fill: none; stroke-linecap: round; }
      .ribbon-2 { stroke: url(#ribbon); stroke-width: 6; fill: none; stroke-linecap: round; }
      .c-line { stroke: #b32323; stroke-width: 1.6; stroke-linecap: round; stroke-opacity: 0.78; fill: none; }
      .node-glow { fill: url(#coreglow); }
      .node-core { fill: #d32f2f; }
      .node-center { fill: #ffffff; }
      @keyframes star-fade {
        0%, 100% { opacity: 0.03; }
        35%, 65% { opacity: 0.94; }
      }
      @keyframes star-breathe {
        0%, 100% { opacity: 0.25; transform: scale(0.88); }
        50% { opacity: 1; transform: scale(1.12); }
      }
      @keyframes wave-glow {
        0%, 100% { opacity: 0.45; }
        50% { opacity: 0.95; }
      }
      .fade-dot { animation: star-fade 4.5s ease-in-out infinite; }
      .star-node { animation: star-breathe 4.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .aurora-wave { animation: wave-glow 6s ease-in-out infinite; }
      @media (prefers-reduced-motion: reduce) {
        .fade-dot, .star-node, .aurora-wave { animation: none !important; opacity: 0.8; }
      }
    </style>
  </defs>
  <rect width="1200" height="260" rx="14" class="bg"/>
  <circle cx="600" cy="130" r="210" class="nebula"/>
  <g class="dust-field">
    <circle cx="110" cy="48" r="1.2" class="dust fade-dot" style="animation-duration:4.1s; animation-delay:-0.5s;"/>
    <circle cx="195" cy="195" r="1.4" class="dust fade-dot" style="animation-duration:5.3s; animation-delay:-2.1s;"/>
    <circle cx="285" cy="65" r="1.0" class="dust fade-dot" style="animation-duration:3.8s; animation-delay:-1.3s;"/>
    <circle cx="375" cy="210" r="1.3" class="dust fade-dot" style="animation-duration:4.9s; animation-delay:-3.0s;"/>
    <circle cx="835" cy="52" r="1.1" class="dust fade-dot" style="animation-duration:5.5s; animation-delay:-0.7s;"/>
    <circle cx="920" cy="204" r="1.5" class="dust fade-dot" style="animation-duration:4.2s; animation-delay:-2.5s;"/>
    <circle cx="1010" cy="76" r="1.2" class="dust fade-dot" style="animation-duration:5.0s; animation-delay:-1.8s;"/>
    <circle cx="1095" cy="186" r="1.4" class="dust fade-dot" style="animation-duration:3.9s; animation-delay:-0.4s;"/>
    <circle cx="490" cy="44" r="1.1" class="dust fade-dot" style="animation-duration:4.7s; animation-delay:-2.2s;"/>
    <circle cx="710" cy="218" r="1.2" class="dust fade-dot" style="animation-duration:5.1s; animation-delay:-1.1s;"/>
    <circle cx="155" cy="112" r="1.1" class="dust fade-dot" style="animation-duration:4.6s; animation-delay:-2.4s;"/>
    <circle cx="245" cy="175" r="1.0" class="dust fade-dot" style="animation-duration:4.2s; animation-delay:-0.9s;"/>
    <circle cx="965" cy="145" r="1.1" class="dust fade-dot" style="animation-duration:4.9s; animation-delay:-3.1s;"/>
    <circle cx="1055" cy="118" r="1.2" class="dust fade-dot" style="animation-duration:4.4s; animation-delay:-1.6s;"/>
  </g>
  <g class="aurora-wave">
    <path d="M120 175 C290 65, 450 205, 620 115 C790 25, 930 185, 1080 90" class="ribbon-1"/>
    <path d="M150 140 C330 215, 490 55, 660 145 C820 220, 960 65, 1060 135" class="ribbon-2"/>
  </g>
  <g class="constellation-lines">
    <path d="M360 120 L480 92 L600 132 L720 88 L840 124" class="c-line"/>
    <path d="M480 92 L540 178 L600 132 L660 178 L720 88" class="c-line"/>
  </g>
  <g class="constellation-nodes">
    <g class="star-node" style="animation-duration:3.8s; animation-delay:-0.4s;">
      <circle cx="360" cy="120" r="10" class="node-glow"/><circle cx="360" cy="120" r="3.4" class="node-core"/><circle cx="360" cy="120" r="1.5" class="node-center"/>
    </g>
    <g class="star-node" style="animation-duration:4.6s; animation-delay:-1.7s;">
      <circle cx="480" cy="92" r="12" class="node-glow"/><circle cx="480" cy="92" r="4.0" class="node-core"/><circle cx="480" cy="92" r="1.8" class="node-center"/>
    </g>
    <g class="star-node" style="animation-duration:4.0s; animation-delay:-2.5s;">
      <circle cx="600" cy="132" r="14" class="node-glow"/><circle cx="600" cy="132" r="4.8" class="node-core"/><circle cx="600" cy="132" r="2.2" class="node-center"/>
    </g>
    <g class="star-node" style="animation-duration:4.4s; animation-delay:-1.0s;">
      <circle cx="720" cy="88" r="12" class="node-glow"/><circle cx="720" cy="88" r="4.0" class="node-core"/><circle cx="720" cy="88" r="1.8" class="node-center"/>
    </g>
    <g class="star-node" style="animation-duration:3.9s; animation-delay:-2.9s;">
      <circle cx="840" cy="124" r="10" class="node-glow"/><circle cx="840" cy="124" r="3.4" class="node-core"/><circle cx="840" cy="124" r="1.5" class="node-center"/>
    </g>
    <g class="star-node" style="animation-duration:4.8s; animation-delay:-0.7s;">
      <circle cx="540" cy="178" r="9" class="node-glow"/><circle cx="540" cy="178" r="3.0" class="node-core"/><circle cx="540" cy="178" r="1.3" class="node-center"/>
    </g>
    <g class="star-node" style="animation-duration:4.3s; animation-delay:-2.1s;">
      <circle cx="660" cy="178" r="9" class="node-glow"/><circle cx="660" cy="178" r="3.0" class="node-core"/><circle cx="660" cy="178" r="1.3" class="node-center"/>
    </g>
  </g>
</svg>
