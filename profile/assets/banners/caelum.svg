<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" role="img" aria-label="Caelum Tactile Spatial Constellation v2">
  <defs>
    <radialGradient id="nebula" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#b32323" stop-opacity="0.30"/>
      <stop offset="55%" stop-color="#b32323" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#b32323" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="coreglow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.92"/>
      <stop offset="38%" stop-color="#d32f2f" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#b32323" stop-opacity="0"/>
    </radialGradient>
    <style>
      .bg { fill: #272727; }
      .nebula { fill: url(#nebula); }
      .dust { fill: #b32323; }
      .grid-line { stroke: #b32323; stroke-width: 0.9; stroke-opacity: 0.25; fill: none; }
      .c-line { stroke: #b32323; stroke-width: 1.6; stroke-linecap: round; stroke-opacity: 0.88; fill: none; }
      .tactile-ring { stroke: #d32f2f; stroke-width: 1.1; stroke-dasharray: 3, 5; stroke-opacity: 0.55; fill: none; }
      .node-glow { fill: url(#coreglow); }
      .node-core { fill: #d32f2f; }
      .node-center { fill: #ffffff; }
      @keyframes star-fade { 0%, 100% { opacity: 0.03; } 35%, 65% { opacity: 0.94; } }
      @keyframes star-breathe { 0%, 100% { opacity: 0.28; transform: scale(0.88); } 50% { opacity: 1; transform: scale(1.15); } }
      @keyframes touch-ripple { 0% { transform: scale(0.75); opacity: 0.8; } 100% { transform: scale(1.4); opacity: 0; } }
      .fade-dot { animation: star-fade 4.4s ease-in-out infinite; }
      .star-node { animation: star-breathe 4.0s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .ripple { animation: touch-ripple 4.0s ease-out infinite; transform-box: fill-box; transform-origin: center; }
      @media (prefers-reduced-motion: reduce) { .fade-dot, .star-node, .ripple { animation: none !important; opacity: 0.85; } }
    </style>
  </defs>
  <rect width="1200" height="260" rx="14" class="bg"/>
  <circle cx="600" cy="130" r="195" class="nebula"/>
  <g class="spatial-grid">
    <path d="M430 218 L520 155 L680 155 L770 218 Z" class="grid-line"/>
    <path d="M475 186 L725 186 M560 155 L540 218 M640 155 L660 218" class="grid-line"/>
  </g>
  <g class="dust-field">
    <circle cx="95" cy="52" r="1.2" class="dust fade-dot" style="animation-duration:4.1s; animation-delay:-0.5s;"/>
    <circle cx="180" cy="196" r="1.4" class="dust fade-dot" style="animation-duration:5.1s; animation-delay:-2.1s;"/>
    <circle cx="270" cy="78" r="1.0" class="dust fade-dot" style="animation-duration:3.8s; animation-delay:-1.3s;"/>
    <circle cx="930" cy="84" r="1.2" class="dust fade-dot" style="animation-duration:4.9s; animation-delay:-2.5s;"/>
    <circle cx="1025" cy="194" r="1.4" class="dust fade-dot" style="animation-duration:4.2s; animation-delay:-1.1s;"/>
    <circle cx="1110" cy="64" r="1.1" class="dust fade-dot" style="animation-duration:5.4s; animation-delay:-3.2s;"/>
    <circle cx="142" cy="122" r="1.1" class="dust fade-dot" style="animation-duration:4.7s; animation-delay:-2.3s;"/>
    <circle cx="298" cy="158" r="1.0" class="dust fade-dot" style="animation-duration:3.9s; animation-delay:-1.7s;"/>
    <circle cx="385" cy="48" r="1.2" class="dust fade-dot" style="animation-duration:5.0s; animation-delay:-0.7s;"/>
    <circle cx="412" cy="188" r="1.1" class="dust fade-dot" style="animation-duration:4.5s; animation-delay:-2.9s;"/>
    <circle cx="795" cy="54" r="1.2" class="dust fade-dot" style="animation-duration:4.8s; animation-delay:-1.4s;"/>
    <circle cx="855" cy="168" r="1.0" class="dust fade-dot" style="animation-duration:4.3s; animation-delay:-3.0s;"/>
    <circle cx="968" cy="144" r="1.2" class="dust fade-dot" style="animation-duration:5.1s; animation-delay:-0.6s;"/>
    <circle cx="1148" cy="186" r="1.1" class="dust fade-dot" style="animation-duration:4.4s; animation-delay:-2.0s;"/>
  </g>
  <circle cx="595" cy="112" r="34" class="tactile-ring ripple"/>
  <circle cx="595" cy="112" r="56" class="tactile-ring ripple" style="animation-delay:-2.0s;"/>
  <path d="M515 64 L595 112 L642 156 L695 202 M595 112 L552 148" class="c-line"/>
  <g class="constellation-nodes">
    <g class="star-node" style="animation-delay:-0.4s;"><circle cx="515" cy="64" r="11" class="node-glow"/><circle cx="515" cy="64" r="3.6" class="node-core"/><circle cx="515" cy="64" r="1.6" class="node-center"/></g>
    <g class="star-node" style="animation-delay:-1.5s;"><circle cx="595" cy="112" r="16" class="node-glow"/><circle cx="595" cy="112" r="5.0" class="node-core"/><circle cx="595" cy="112" r="2.2" class="node-center"/></g>
    <g class="star-node" style="animation-delay:-2.3s;"><circle cx="642" cy="156" r="12" class="node-glow"/><circle cx="642" cy="156" r="3.9" class="node-core"/><circle cx="642" cy="156" r="1.7" class="node-center"/></g>
    <g class="star-node" style="animation-delay:-0.9s;"><circle cx="695" cy="202" r="11" class="node-glow"/><circle cx="695" cy="202" r="3.6" class="node-core"/><circle cx="695" cy="202" r="1.6" class="node-center"/></g>
    <g class="star-node" style="animation-delay:-2.7s;"><circle cx="552" cy="148" r="9" class="node-glow"/><circle cx="552" cy="148" r="3.0" class="node-core"/><circle cx="552" cy="148" r="1.3" class="node-center"/></g>
  </g>
</svg>
