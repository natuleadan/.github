<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" role="img" aria-label="Pulsar Beacon">
  <defs>
    <radialGradient id="nebula" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#b32323" stop-opacity="0.34"/>
      <stop offset="55%" stop-color="#b32323" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#b32323" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#b32323" stop-opacity="0"/>
      <stop offset="48%" stop-color="#d32f2f" stop-opacity="0.65"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="52%" stop-color="#d32f2f" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#b32323" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="coreglow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#d32f2f" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#b32323" stop-opacity="0"/>
    </radialGradient>
    <style>
      .bg { fill: #272727; }
      .nebula { fill: url(#nebula); }
      .dust { fill: #b32323; }
      .beam-line { stroke: url(#beam); stroke-width: 3; stroke-linecap: round; }
      .ring { stroke: #b32323; stroke-width: 1.2; fill: none; stroke-opacity: 0.55; }
      .ring-dashed { stroke: #b32323; stroke-width: 1.1; stroke-dasharray: 4, 6; fill: none; stroke-opacity: 0.45; }
      .node-glow { fill: url(#coreglow); }
      .node-core { fill: #d32f2f; }
      .node-center { fill: #ffffff; }
      @keyframes star-fade {
        0%, 100% { opacity: 0.03; }
        35%, 65% { opacity: 0.94; }
      }
      @keyframes pulse-ring {
        0% { transform: scale(0.75); opacity: 0.85; }
        100% { transform: scale(1.45); opacity: 0; }
      }
      @keyframes star-breathe {
        0%, 100% { opacity: 0.35; transform: scale(0.9); }
        50% { opacity: 1; transform: scale(1.15); }
      }
      .fade-dot { animation: star-fade 4.5s ease-in-out infinite; }
      .star-node { animation: star-breathe 3.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .pulse-wave { animation: pulse-ring 3.8s ease-out infinite; transform-box: fill-box; transform-origin: center; }
      @media (prefers-reduced-motion: reduce) {
        .fade-dot, .star-node, .pulse-wave { animation: none !important; opacity: 0.8; }
      }
    </style>
  </defs>
  <rect width="1200" height="260" rx="14" class="bg"/>
  <circle cx="600" cy="130" r="195" class="nebula"/>
  <g class="dust-field">
    <circle cx="105" cy="48" r="1.2" class="dust fade-dot" style="animation-duration:4.1s; animation-delay:-0.5s;"/>
    <circle cx="188" cy="198" r="1.4" class="dust fade-dot" style="animation-duration:5.0s; animation-delay:-2.1s;"/>
    <circle cx="275" cy="72" r="1.0" class="dust fade-dot" style="animation-duration:3.8s; animation-delay:-1.3s;"/>
    <circle cx="355" cy="212" r="1.3" class="dust fade-dot" style="animation-duration:4.7s; animation-delay:-3.0s;"/>
    <circle cx="845" cy="54" r="1.1" class="dust fade-dot" style="animation-duration:5.3s; animation-delay:-0.8s;"/>
    <circle cx="928" cy="196" r="1.5" class="dust fade-dot" style="animation-duration:4.2s; animation-delay:-2.5s;"/>
    <circle cx="1015" cy="82" r="1.2" class="dust fade-dot" style="animation-duration:4.9s; animation-delay:-1.7s;"/>
    <circle cx="1098" cy="188" r="1.3" class="dust fade-dot" style="animation-duration:3.9s; animation-delay:-0.4s;"/>
    <circle cx="152" cy="124" r="1.1" class="dust fade-dot" style="animation-duration:4.6s; animation-delay:-2.2s;"/>
    <circle cx="242" cy="158" r="1.0" class="dust fade-dot" style="animation-duration:4.1s; animation-delay:-1.5s;"/>
    <circle cx="425" cy="52" r="1.2" class="dust fade-dot" style="animation-duration:5.2s; animation-delay:-0.9s;"/>
    <circle cx="780" cy="208" r="1.1" class="dust fade-dot" style="animation-duration:4.5s; animation-delay:-2.7s;"/>
    <circle cx="965" cy="134" r="1.2" class="dust fade-dot" style="animation-duration:4.8s; animation-delay:-1.3s;"/>
    <circle cx="1142" cy="96" r="1.1" class="dust fade-dot" style="animation-duration:4.3s; animation-delay:-2.9s;"/>
  </g>
  <line x1="260" y1="210" x2="940" y2="50" class="beam-line"/>
  <line x1="340" y1="68" x2="860" y2="192" class="ring-dashed"/>
  <circle cx="600" cy="130" r="46" class="ring pulse-wave"/>
  <circle cx="600" cy="130" r="78" class="ring pulse-wave" style="animation-delay:-1.9s;"/>
  <ellipse cx="600" cy="130" rx="115" ry="38" transform="rotate(-13 600 130)" class="ring-dashed"/>
  <g class="constellation-nodes">
    <g class="star-node">
      <circle cx="600" cy="130" r="24" class="node-glow"/><circle cx="600" cy="130" r="6.5" class="node-core"/><circle cx="600" cy="130" r="3" class="node-center"/>
    </g>
    <g class="star-node" style="animation-duration:4.6s; animation-delay:-1.2s;">
      <circle cx="490" cy="104" r="8" class="node-glow"/><circle cx="490" cy="104" r="2.8" class="node-core"/><circle cx="490" cy="104" r="1.2" class="node-center"/>
    </g>
    <g class="star-node" style="animation-duration:4.2s; animation-delay:-2.4s;">
      <circle cx="710" cy="156" r="8" class="node-glow"/><circle cx="710" cy="156" r="2.8" class="node-core"/><circle cx="710" cy="156" r="1.2" class="node-center"/>
    </g>
  </g>
</svg>
