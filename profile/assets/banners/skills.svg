<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" role="img" aria-label="Natuleadan Skills Hexagonal Matrix">
  <defs>
    <radialGradient id="forgeglow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d32f2f" stop-opacity="0.34"/>
      <stop offset="55%" stop-color="#b32323" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#b32323" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="coreglow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d32f2f" stop-opacity="0.85"/>
      <stop offset="45%" stop-color="#b32323" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#b32323" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="prism" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d32f2f" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#b32323" stop-opacity="0.80"/>
      <stop offset="100%" stop-color="#5c1111" stop-opacity="0.95"/>
    </linearGradient>
    <style>
      .bg { fill: #272727; }
      .glow { fill: url(#forgeglow); }
      .dust { fill: #b32323; }
      .hex-outer { stroke: #b32323; stroke-width: 1.6; stroke-opacity: 0.78; fill: none; }
      .hex-subtle { stroke: #b32323; stroke-width: 1.1; stroke-opacity: 0.34; fill: none; }
      .trace { stroke: #d32f2f; stroke-width: 1.4; stroke-opacity: 0.65; fill: none; stroke-linecap: round; }
      .prism-fill { fill: url(#prism); stroke: #ffffff; stroke-width: 1.2; stroke-opacity: 0.55; }
      .node-glow { fill: url(#coreglow); }
      .node-core { fill: #d32f2f; }
      .node-center { fill: #ffffff; }
      @keyframes hex-fade { 0%, 100% { opacity: 0.20; transform: scale(0.90); } 40%, 60% { opacity: 1; transform: scale(1.12); } }
      @keyframes star-fade { 0%, 100% { opacity: 0.03; } 35%, 65% { opacity: 0.94; } }
      @keyframes prism-pulse { 0%, 100% { transform: scale(0.95); opacity: 0.86; } 50% { transform: scale(1.06); opacity: 1; } }
      .fade-node { animation: hex-fade 4.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .fade-dot { animation: star-fade 4.4s ease-in-out infinite; }
      .prism-core { animation: prism-pulse 4.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      @media (prefers-reduced-motion: reduce) { .fade-node, .fade-dot, .prism-core { animation: none !important; opacity: 0.85; } }
    </style>
  </defs>
  <rect width="1200" height="260" rx="14" class="bg"/>
  <circle cx="600" cy="130" r="195" class="glow"/>
  <g class="dust-field">
    <circle cx="95" cy="48" r="1.2" class="dust fade-dot" style="animation-duration:4.1s; animation-delay:-0.5s;"/>
    <circle cx="175" cy="196" r="1.4" class="dust fade-dot" style="animation-duration:5.1s; animation-delay:-2.1s;"/>
    <circle cx="265" cy="72" r="1.0" class="dust fade-dot" style="animation-duration:3.8s; animation-delay:-1.4s;"/>
    <circle cx="935" cy="76" r="1.1" class="dust fade-dot" style="animation-duration:4.9s; animation-delay:-2.5s;"/>
    <circle cx="1025" cy="194" r="1.4" class="dust fade-dot" style="animation-duration:4.2s; animation-delay:-1.1s;"/>
    <circle cx="1105" cy="58" r="1.2" class="dust fade-dot" style="animation-duration:5.3s; animation-delay:-3.2s;"/>
  </g>
  <g class="hex-grid">
    <polygon points="600,48 671,89 671,171 600,212 529,171 529,89" class="hex-outer"/>
    <polygon points="458,48 529,89 529,171 458,212 387,171 387,89" class="hex-subtle"/>
    <polygon points="742,48 813,89 813,171 742,212 671,171 671,89" class="hex-subtle"/>
    <polygon points="316,89 387,130 316,171 245,130" class="hex-subtle"/>
    <polygon points="884,89 955,130 884,171 813,130" class="hex-subtle"/>
  </g>
  <g class="circuit-traces">
    <path d="M160 130 L387 130 M813 130 L1040 130" class="trace"/>
    <path d="M260 66 L387 89 M940 66 L813 89" class="trace"/>
    <path d="M260 194 L387 171 M940 194 L813 171" class="trace"/>
  </g>
  <g class="prism-core">
    <polygon points="600,78 645,104 645,156 600,182 555,156 555,104" class="prism-fill"/>
    <path d="M600,78 L600,182 M555,104 L645,156 M645,104 L555,156" stroke="#ffffff" stroke-width="0.9" stroke-opacity="0.45"/>
    <circle cx="600" cy="130" r="4.5" class="node-center"/>
  </g>
  <!-- 7 primary glowing nodes representing the 7 constellations -->
  <g class="matrix-nodes">
    <g class="fade-node" style="animation-delay:-0.4s;"><circle cx="600" cy="48" r="10" class="node-glow"/><circle cx="600" cy="48" r="3.6" class="node-core"/><circle cx="600" cy="48" r="1.6" class="node-center"/></g>
    <g class="fade-node" style="animation-delay:-1.0s;"><circle cx="529" cy="89" r="10" class="node-glow"/><circle cx="529" cy="89" r="3.6" class="node-core"/><circle cx="529" cy="89" r="1.6" class="node-center"/></g>
    <g class="fade-node" style="animation-delay:-1.6s;"><circle cx="671" cy="89" r="10" class="node-glow"/><circle cx="671" cy="89" r="3.6" class="node-core"/><circle cx="671" cy="89" r="1.6" class="node-center"/></g>
    <g class="fade-node" style="animation-delay:-2.2s;"><circle cx="529" cy="171" r="10" class="node-glow"/><circle cx="529" cy="171" r="3.6" class="node-core"/><circle cx="529" cy="171" r="1.6" class="node-center"/></g>
    <g class="fade-node" style="animation-delay:-2.8s;"><circle cx="671" cy="171" r="10" class="node-glow"/><circle cx="671" cy="171" r="3.6" class="node-core"/><circle cx="671" cy="171" r="1.6" class="node-center"/></g>
    <g class="fade-node" style="animation-delay:-3.4s;"><circle cx="387" cy="130" r="10" class="node-glow"/><circle cx="387" cy="130" r="3.6" class="node-core"/><circle cx="387" cy="130" r="1.6" class="node-center"/></g>
    <g class="fade-node" style="animation-delay:-4.0s;"><circle cx="813" cy="130" r="10" class="node-glow"/><circle cx="813" cy="130" r="3.6" class="node-core"/><circle cx="813" cy="130" r="1.6" class="node-center"/></g>
  </g>
</svg>
